services:
  backend:
    build: ./backend
    container_name: clash-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=file:./dev.db
      - PORT=5000
    volumes:
      - backend_data:/app/prisma

  frontend:
    build: ./frontend
    container_name: clash-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
