services:
  backend:
    build: ./backend
    container_name: clash-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=file:./dev.db
      - PORT=5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - backend_data:/app/prisma

  frontend:
    build: ./frontend
    container_name: clash-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
