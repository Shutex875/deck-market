name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install & Test Backend
      env:
        DATABASE_URL: file:../data/bastdecks.db
      run: |
        cd backend
        npm ci
        npx prisma generate
        npm test

    - name: Install & Build Frontend
      run: |
        cd frontend
        npm ci
        npm run typecheck
        npm run build
